[build]
publish = "dist"
command = "pnpm run build"

[build.environment]
NODE_VERSION = "24"

# 每章 SPA 路由兜底（部署前缀 /web-2026b 下；与 dist/web-2026b/_redirects 内容一致）。
# 注意：发布根下课程位于 /web-2026b/ 子路径，访问 /web-2026b/ 进入课程。
[[redirects]]
from = "/web-2026b/ch00/*"
to = "/web-2026b/ch00/index.html"
status = 200

[[redirects]]
from = "/web-2026b/ch01/*"
to = "/web-2026b/ch01/index.html"
status = 200
