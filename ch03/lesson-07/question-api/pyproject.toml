[project]
name = "question-api"
version = "0.7.0"
description = "第 7 课：用 SQLAlchemy ORM 读写第 6 课的五表数据，并接入 FastAPI"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "sqlalchemy==2.0.54",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "httpx2==2.16.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
