requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "jinja2==3.1.6",
  "python-multipart==0.0.32",
]

[dependency-groups]
dev = ["debugpy==1.8.22"]

[tool.uv]
package = false
